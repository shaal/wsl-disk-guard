# Installed by disk-guard (install.sh --keep-alive <unit>).
# systemd never gives up restarting this unit. The delay starts at 5 s and
# grows to 2 min in a crash loop, so a loop does not burn CPU.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
RestartSteps=6
RestartMaxDelaySec=120
